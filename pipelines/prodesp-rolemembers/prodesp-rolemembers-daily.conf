input {
  exec {
    id => "prodesp_rolemembers_daily_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/prodesp_rolemembers_worker.py"
    schedule => "${PRODESP_ROLEMEMBERS_SCHEDULE:0 3 * * *}"  # 03:00 hora local do servidor (America/Sao_Paulo) -- NAO e UTC
    codec => "json_lines"                                         # dump grande; worker emite heartbeat (CLAUDE.md 3.1/3.2)
  }
}

# Membros por role do tenant CyberArk Prodesp, via relatorio
# @/lib/reports/compliance/mfa.js (parametro roleId) -- regra DIFERENTE do
# cyberark-prodesp-directory (GetRoleMembers), rodando lado a lado pra
# investigar a perda de dados do outro. Snapshot do dia com checkpoint por
# role/pagina em /var/lib/logstash/prodesp-rolemembers/ (guarda as linhas):
# execucao que caiu e retomada pela proxima do mesmo dia, que reemite tudo.
# Tipos de doc no mesmo data stream:
#   doc_type=member       um por par (role, usuario)
#   doc_type=user         um por usuario da tabela User (role_count, has_role)
#   doc_type=role_summary um por role por execucao: FullCount x coletado,
#                         status ok/incompleto/erro/pendente
#   doc_type=run_summary  um por execucao, totais
# _id de member/user = snapshot_date + chave -> reemissao vira 409 (dedup
# benigno); summaries sao por run_id (cada execucao fica registrada).
filter {
  if ![_doc_id] { drop { } }   # descarta o heartbeat e linhas invalidas

  date {                       # @timestamp = momento do snapshot
    match => ["snapshot_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_snapshot_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message", "snapshot_ms"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${PRODESP_ROLEMEMBERS_DATA_STREAM:logs-cyberark.prodesprolemembers-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
