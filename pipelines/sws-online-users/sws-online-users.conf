input {
  exec {
    id => "sws_online_users_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/sws_online_users_worker.py"
    interval => "${SWS_ONLINE_INTERVAL_SECONDS:900}"
    codec => "plain"
  }
}

filter {
  if ![message] or [message] =~ /^\s*$/ { drop { } }   # ciclo vazio -> evita crash (CLAUDE.md 3.1)

  split { id => "sws_online_users_split" field => "message" }   # SEM terminator (CLAUDE.md 3.4)

  if [message] =~ /^\s*$/ { drop { } }

  json { id => "sws_online_users_json" source => "message" }

  if ![_doc_id] { drop { } }

  date {                       # @timestamp = tempo do evento (run da varredura), nao da ingestao
    match => ["run_time_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_run_time_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "run_time_ms", "command", "host", "@version", "process", "message"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${SWS_ONLINE_USERS_DATA_STREAM:logs-sws.online-users-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
