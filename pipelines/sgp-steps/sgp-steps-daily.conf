input {
  exec {
    id => "sgp_steps_daily_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/sgp_steps_worker.py"
    schedule => "${SGP_STEPS_SCHEDULE:0 7 * * *}"  # hora local do servidor (America/Sao_Paulo) -- NAO e UTC
    codec => "json_lines"                         # 24h de steps = volume grande; worker emite heartbeat (CLAUDE.md 3.1/3.2)
  }
}

# Steps das sessoes SGP (Alero, freeSearch=sgp) abertas nas ultimas 24h,
# 1x/dia as 07:00. Um documento por sessionStep; sessao sem step vira 1 doc
# sintetico (extraction_status=SEM_STEPS). Janela por checkpoint + overlap
# (ver docstring do worker): execucao perdida e coberta na seguinte, e o
# overlap revarre sessoes que ainda estavam abertas no disparo anterior
# (CLAUDE.md 3.12). _id deterministico -> re-vistos viram 409 benigno.
filter {
  if ![_doc_id] { drop { } }   # descarta o heartbeat e linhas invalidas

  date {                       # @timestamp = horario do step, nao da ingestao (3.9)
    match => ["event_time_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_event_time_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message", "event_time_ms"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${SGP_STEPS_DATA_STREAM:logs-sgp.steps-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
