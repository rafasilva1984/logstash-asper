input {
  exec {
    id => "cyberark_apiprodesp_directory_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/cyberark_apiprodesp_worker.py"
    schedule => "${APIPRODESP_SCHEDULE:0 20,23 * * *}"  # hora local do servidor (America/Sao_Paulo) -- NAO e UTC
    # Duas execucoes por noite (20h + 23h), padrao herdado do Detran/Prodesp:
    # rede de seguranca barata contra .env corrompido/rede fora na 1a
    # execucao (ver DEPLOY.md do detran-directory, Incidente #2). _id
    # continua chaveado por snapshot_date (dia): a 2a rodada regenera os
    # mesmos _id de quem nao mudou (409 benigno) e so acrescenta o que
    # mudou entre as duas.
    codec => "json_lines"
  }
}

# Join User <-> RoleMember/Role (CyberArk tenant ApiProdesp, abb4725) feito
# no worker Python, achatado em UM documento por par (usuario, role) —
# usuario sem nenhuma role gera 1 doc com role_id/role_name = null. 1x/noite
# (x2, ver acima), sem checkpoint: cada execucao e um snapshot completo
# independente, carimbado com snapshot_date (data BRT do disparo). _id
# determinístico (snapshot_date + user + role) -> rerun no mesmo dia vira
# 409 (dedup benigno); a proxima noite gera um snapshot novo (historico
# preservado, ILM sem fase de delete).
filter {
  if ![_doc_id] { drop { } }   # descarta o heartbeat e linhas invalidas

  date {                       # @timestamp = momento do snapshot
    match => ["snapshot_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_snapshot_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message", "snapshot_ms"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${APIPRODESP_DATA_STREAM:logs-cyberark.apiprodespdirectory-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
