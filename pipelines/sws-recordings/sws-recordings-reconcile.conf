input {
  exec {
    id => "sws_recordings_reconcile_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/sws_recordings_worker.py --mode reconcile"
    schedule => "${SWS_RECONCILE_SCHEDULE:0 4 * * *}"
    codec => "json_lines"
  }
}

# Varredura diaria de reconciliacao: a API da Alero filtra recordings pelo
# INICIO da sessao e so devolve sessao FECHADA. Uma sessao longa que comecou
# fora da janela do pipeline realtime pode nunca aparecer nele. Este pipeline
# revarre uma janela larga (SWS_RECONCILE_LOOKBACK_HOURS) todo dia; como o
# _id e deterministico e o output usa action=create, tudo que ja foi
# indexado pelo realtime vira 409 (dedup benigno) — so os documentos novos
# (sessoes longas que fecharam depois) entram de fato.
filter {
  if ![_doc_id] { drop { } }

  date {
    match => ["event_time_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_event_time_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message", "event_time_ms"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${SWS_RECORDINGS_DATA_STREAM:logs-sws.recordings-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
