input {
  exec {
    id => "sws_recordings_realtime_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/sws_recordings_worker.py --mode realtime"
    interval => "${SWS_REALTIME_INTERVAL_SECONDS:60}"
    codec => "json_lines"
  }
}

filter {
  if ![_doc_id] { drop { } }   # descarta o heartbeat e linhas invalidas

  date {                       # @timestamp = tempo do evento, nao da ingestao
    match => ["event_time_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_event_time_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message", "event_time_ms"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${SWS_RECORDINGS_DATA_STREAM:logs-sws.recordings-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
