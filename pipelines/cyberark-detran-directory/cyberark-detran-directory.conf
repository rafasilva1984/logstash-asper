input {
  exec {
    id => "cyberark_detran_directory_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/cyberark_detran_worker.py"
    schedule => "${DETRAN_SCHEDULE:0 20,23 * * *}"  # hora local do servidor (America/Sao_Paulo, confirmado 2026-08-24) -- NAO e UTC
    # Duas execucoes por noite (20h + 23h), nao uma: rede de seguranca barata.
    # Incidente 2026-08-24/25 -- o .env em producao ficou com DETRAN_SCHEDULE
    # corrompido ("45 0 * * */'") e o job simplesmente nunca disparou, em
    # silencio, por dias, sem ninguem perceber (ver DEPLOY.md). O requisito
    # real do cliente e soh "dado pronto e correto toda manha" (nao ingestao
    # continua) -- rodar 2x na mesma noite cobre falha isolada da 1a execucao
    # (rede, auth, .env errado, etc.) sem custar mais que um segundo dump
    # completo (~20-25min), que o backend ja aguenta bem numa execucao soh.
    # _id continua chaveado por snapshot_date (dia): a 2a rodada regenera os
    # mesmos _id de quem nao mudou (409 benigno) e so acrescenta o que mudou
    # entre as duas.
    codec => "json_lines"
  }
}

# Join User <-> RoleMember/Role (CyberArk tenant Detran) feito no worker
# Python, achatado em UM documento por par (usuario, role) — usuario sem
# nenhuma role gera 1 doc com role_id/role_name = null. 1x/noite, sem
# checkpoint: cada execucao e um snapshot completo independente,
# carimbado com snapshot_date (data BRT do disparo). _id determinístico
# (snapshot_date + user + role) -> rerun no mesmo dia vira 409 (dedup
# benigno); a proxima noite gera um snapshot novo (historico preservado,
# ILM sem fase de delete).
filter {
  if ![_doc_id] { drop { } }   # descarta o heartbeat e linhas invalidas

  date {                       # @timestamp = momento do snapshot
    match => ["snapshot_ms", "UNIX_MS"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_snapshot_ms"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message", "snapshot_ms"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${DETRAN_DATA_STREAM:logs-cyberark.detrandirectory-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
