input {
  exec {
    id => "prodesp_applaunch_realtime_exec"
    command => "/usr/bin/python3 /etc/logstash/pipelines/prodesp_applaunch_worker.py"
    interval => "${PRODESP_APPLAUNCH_INTERVAL_SECONDS:300}"   # a cada 5 min; janela = checkpoint - overlap -> agora (~10 min)
    codec => "json_lines"                                      # catch-up/backfill pode ser grande; worker emite heartbeat (CLAUDE.md 3.1/3.2)
  }
}

# Acessos a aplicacoes do tenant CyberArk Prodesp (Event
# Cloud.Saas.Application.AppLaunch, Web/OpenIDConnect/OAuth) enriquecidos
# com os dados do usuario (tabela User, join feito no worker — o JOIN em
# SQL estoura timeout nesse tenant). Um documento por evento; _id
# deterministico (Uuid vem NULL, ver worker) -> overlap vira 409 benigno.
filter {
  if ![_doc_id] { drop { } }   # descarta o heartbeat e linhas invalidas

  date {                       # @timestamp = horario do evento, nao da ingestao (3.9)
    match => ["WhenOccurred", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure_WhenOccurred"]
  }

  mutate {
    add_field => { "[@metadata][doc_id]" => "%{[_doc_id]}" }
  }
  mutate {
    remove_field => ["_doc_id", "command", "host", "@version", "process", "message"]
  }
}

output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "${PRODESP_APPLAUNCH_DATA_STREAM:logs-cyberark.prodespapplaunch-default}"
      action => "create"
      document_id => "%{[@metadata][doc_id]}"
      data_stream => false
      manage_template => false
    }
  }
}
